[package]
name = "pulse_pager"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
ed25519-dalek = { version = "2.2", features = ["serde", "rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17"
aes-gcm = "0.10"
anyhow = "1.0"
hex = "0.4"
futures = "0.3"
rand = "0.8"